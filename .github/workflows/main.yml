name: Build WF
# Events that trigger this workflow.
on: 
  # Run for pushes to the main branch.
  push:
    branches:
      - main

  # Run for pull requests targeting main.
  pull_request:
    branches: ['main']

  # Allow the workflow to be started manually.
  workflow_dispatch:

  # Run at 15:00 UTC on weekdays.
  schedule:
    - cron: "0 15 * * 1-5"   

# Limit the workflow's repository permissions to read-only contents.
permissions:
  contents: read

jobs: 
  # Build and package the application, then upload its WAR artifact.
  Build:
    runs-on: ubuntu-latest
    steps: 
      - name: "Code checkout"
        uses: actions/checkout@v5
        with:
          # Fetch complete Git history instead of the default shallow clone.
          fetch-depth: 0

      # Run the Maven install lifecycle to build and package the project.
      - name: "Maven Build"
        run: mvn install

      # Store the generated WAR so it can be downloaded from the run.
      - name: "Upload Build Artifact (WAR)"
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war


  # Run this diagnostic step only when an earlier build step fails.
      - name: "Notify if Build Fails"
        if: failure()
        run: echo "Build Job Failed! Please check logs."

  # Run tests and style checks only after the Build job succeeds.
  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps: 
      - name: Code checkout Test
        uses: actions/checkout@v4

      # Execute the project's automated tests.
      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      # Run Checkstyle to generate a report on Java style issues.
      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: "Run tests on other branches"
        if: github.ref != 'refs/heads/main'
        run: echo "Skipping unit tests and code analysis"