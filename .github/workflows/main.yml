name: Build WF
# Events that trigger this workflow.
on: 
  # Run for pushes to the main branch.
  push:
    branches:
      - main

  # Run for pull requests targeting main.
  pull_request:
    branches: ['main']

  # Allow the workflow to be started manually.
  workflow_dispatch:

  # Run at 15:00 UTC on weekdays.
  schedule:
    - cron: "0 15 * * 1-5"   

# Study-purpose example only: in production, store this value as a repository-level variable.
env:
  ECR_REPOSITORY: 'vprofile-appimage'

# Limit the workflow's repository permissions to read-only contents.
permissions:
  contents: read

jobs: 
  # Build and package the application, then upload its WAR artifact.
  Build:
    runs-on: ubuntu-latest
    steps: 
      - name: "Code checkout"
        uses: actions/checkout@v5
        with:
          # Fetch complete Git history instead of the default shallow clone.
          fetch-depth: 0

      # Run the Maven install lifecycle to build and package the project.
      - name: "Maven Build"
        run: mvn install

      # Store the generated WAR so it can be downloaded from the run.
      - name: "Upload Build Artifact (WAR)"
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war

  # Run this diagnostic step only when an earlier build step fails.
      - name: "Notify if Build Fails"
        if: failure()
        run: echo "Build Job Failed! Please check logs."

  # Run tests and style checks only after the Build job succeeds.
  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps: 
      - name: Code checkout Test
        uses: actions/checkout@v4

      # Execute the project's automated tests.
      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      # Run Checkstyle to generate a report on Java style issues.
      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: "Run tests on other branches"
        if: github.ref != 'refs/heads/main'
        run: echo "Skipping unit tests and code analysis"
  
  # Run security checks only after the Build job succeeds.
  Security_Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps: 
      - name: "Code checkout"
        uses: actions/checkout@v5
        with:
          # Fetch complete Git history instead of the default shallow clone.
          fetch-depth: 0

      # Run a filesystem vulnerability scan to identify known issues in the repository.
      - name: "Run Trivy filesystem scan"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: json
          exit-code: 0
          vuln-type: os,library
          output: trivy-results.json

      # Store the Trivy scan results so they can be downloaded from the run.
      - name: "Upload Trivy scan results as artifact"
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json

  # Publish the validated application image to AWS ECR for deployment.
  BUILD_AND_PUBLISH:
    name: BUILD_AND_PUBLISH
    runs-on: ubuntu-latest
    environment: production
    # Run only after the build, testing, and security validation jobs succeed.
    needs: [Build, Testing, Security_Scan]
    # Only publish from the main branch.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: "Code checkout"
        uses: actions/checkout@v5
        with:
          # Fetch complete Git history instead of the default shallow clone.
          fetch-depth: 0

      # Configure AWS credentials for the deployment environment.
      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Authenticate Docker to Amazon ECR so the image can be pushed.
      - name: "Login to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build, tag, and push the application image to Amazon ECR.
      - name: "Build tag and push image to Amazon ECR"
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Docker-files/app/multistage/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
